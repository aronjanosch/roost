# roost — a long-running, headless dev box for coding agents (herdr +
# claude/codex/opencode/... + headless Chromium). No inbound ports, no Docker
# socket, no sudo. You reach it with `herdr machine add` over an SSH stream
# carried by `docker exec` (see bin/roost).
#
# Default mode PULLS the published image — updates are fast and reproducible.
#   ./bin/roost up        # pull + start
#   ./bin/roost update    # pull newer image + recreate (home survives)
#
# Extra apt packages use an overlay instead of a build arg:
#   ./bin/roost up        # auto-selects compose.user.yml when EXTRA_PACKAGES is set
# Maintainers building the base image:
#   ROOST_BUILD=1 ./bin/roost up   # uses compose.build.yml + Dockerfile
services:
  roost:
    image: ${ROOST_IMAGE:-ghcr.io/aronjanosch/roost:latest}
    container_name: roost
    restart: unless-stopped
    init: true
    environment:
      - TZ=${TZ:-UTC}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - GIT_USER_NAME=${GIT_USER_NAME:-}
      - GIT_USER_EMAIL=${GIT_USER_EMAIL:-}
      - HARNESSES=${HARNESSES:-claude codex opencode}
      - TOOLS=${TOOLS:-herdr uv gh glab npm:ccusage npm:playwright npm:@playwright/mcp}
      - CURSOR=${CURSOR:-0}
      - TRUST_PROJECTS=${TRUST_PROJECTS:-1}
    volumes:
      # The only thing that must survive a recreate: logins, repos, mise tools.
      - ${ROOST_HOME:-/srv/roost}:/home/agent
      # Root-owned host key (0600) and public authorized_keys (0644). Kept
      # outside the agent-writable home so agents cannot change the login set.
      - type: bind
        source: ${ROOST_SSH:-/srv/roost-ssh}
        target: /etc/roost/ssh
        read_only: true
        bind:
          create_host_path: false
    # Chromium/Electron crash with SIGBUS on the default 64 MB.
    shm_size: "1gb"
    # Keep a runaway agent from starving the rest of the host.
    mem_limit: ${MEM_LIMIT:-6g}
    pids_limit: ${PIDS_LIMIT:-2048}
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "3"
