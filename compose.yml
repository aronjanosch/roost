# roost — a long-running, headless dev box for coding agents (herdr +
# claude/codex/opencode/... + headless Chromium). One port: the box's own sshd
# (pubkey-only, user `agent`). No Docker socket, no sudo.
#
# Set PUBLIC_KEYS (here or in .env), then
#   docker compose up -d && docker logs -f roost   # until "roost bootstrap done"
#   ssh -p 2222 agent@<docker-host>
# Every ${VAR:-default} below can be set in a .env next to this file.
# Update: docker compose pull && docker compose up -d (the home volume stays).
# Extra apt packages: see compose.user.yml.
services:
  roost:
    image: ${ROOST_IMAGE:-ghcr.io/aronjanosch/roost:latest}
    container_name: roost
    restart: unless-stopped
    init: true
    ports:
      # Bind to a LAN/Tailscale IP to keep it off other interfaces.
      - "${SSH_BIND:-0.0.0.0}:${SSH_PORT:-2222}:22"
    environment:
      # Who may log in: public keys, comma- or newline-separated.
      - PUBLIC_KEYS=${PUBLIC_KEYS:-}
      - TZ=${TZ:-UTC}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - GIT_USER_NAME=${GIT_USER_NAME:-}
      - GIT_USER_EMAIL=${GIT_USER_EMAIL:-}
      # Optional: logs gh in on start and wires git to it (HTTPS).
      - GH_TOKEN=${GH_TOKEN:-}
      - HARNESSES=${HARNESSES:-claude codex opencode}
      - TOOLS=${TOOLS:-herdr uv gh glab npm:ccusage npm:playwright npm:@playwright/mcp}
      - CURSOR=${CURSOR:-0}
      - TRUST_PROJECTS=${TRUST_PROJECTS:-1}
      # Heeler QR pairing (roost-pair): off by default, see docs/reference.md.
      - HEELER_PAIRING=${HEELER_PAIRING:-0}
      - HEELER_ADDRESSES=${HEELER_ADDRESSES:-}
      - HEELER_PORT=${SSH_PORT:-2222}
    volumes:
      # The only thing that must survive a recreate: logins, repos, mise tools.
      - ${ROOST_HOME:-/srv/roost}:/home/agent
      # SSH host key (generated on first start) and extra authorized_keys.
      # Root-owned and outside the agent's home: agents cannot add logins.
      - ${ROOST_SSH:-/srv/roost-ssh}:/etc/roost/ssh
    # Chromium/Electron crash with SIGBUS on the default 64 MB.
    shm_size: "1gb"
    # Keep a runaway agent from starving the rest of the host.
    mem_limit: ${MEM_LIMIT:-6g}
    pids_limit: ${PIDS_LIMIT:-2048}
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "3"
