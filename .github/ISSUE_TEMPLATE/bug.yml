name: Bug
description: Something in roost doesn't work as documented.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. docker compose up -d
        2. ssh roost
    validations:
      required: true
  - type: input
    id: host
    attributes:
      label: Docker host
      placeholder: Unraid 7.1, Ubuntu 24.04 + Docker 27, TrueNAS, …
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: "`docker logs roost`. Remove tokens and keys."
      render: text
