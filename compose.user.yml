# Overlay: extra apt packages on top of the published image.
#   EXTRA_PACKAGES="ffmpeg libpq-dev" in .env, then
#   docker compose -f compose.yml -f compose.user.yml up -d --build
# Re-run the same command after pulling a new base image.
services:
  roost:
    image: roost:custom
    build:
      context: .
      dockerfile: Dockerfile.user
      args:
        ROOST_IMAGE: ${ROOST_IMAGE:-ghcr.io/aronjanosch/roost:latest}
        EXTRA_PACKAGES: ${EXTRA_PACKAGES:-}
