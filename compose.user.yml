# Overlay: end-user apt packages on top of the published image.
# Selected automatically by `./bin/agent-dev up` when EXTRA_PACKAGES is set.
#   docker compose -f compose.yml -f compose.user.yml up -d --build
services:
  agent-dev:
    image: agent-dev:custom
    build:
      context: .
      dockerfile: Dockerfile.user
      args:
        AGENT_DEV_IMAGE: ${AGENT_DEV_IMAGE:-ghcr.io/aronjanosch/agent-dev:latest}
        EXTRA_PACKAGES: ${EXTRA_PACKAGES:-}
